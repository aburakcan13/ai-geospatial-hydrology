project:
  name: "AI-Driven Geospatial Hydrology"
  version: "0.1.0"
  seed: 42

data:
  sentinel_bands: ["B2", "B3", "B4", "B8", "B11", "B12"]
  indices: ["MNDWI", "AWEIsh"]
  patch_size: 256
  overlap: 32
  batch_size: 16
  num_workers: 4

model:
  architecture: "BoundaryAwareResUNet"
  in_channels: 8
  num_classes: 1
  lr: 0.0001
  weight_decay: 0.00001
  loss_weights:
    water_bce: 0.6
    boundary_bce: 0.4

training:
  epochs: 50
  early_stopping_patience: 10
  device: "cuda"

name: CI Pipeline - Geospatial Hydrology

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies (GDAL/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e ".[dev]" || pip install -e .

      - name: Lint with Flake8
        run: |
          # Syntax hataları ve tanımsız değişken kontrolü
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Karmaşıklık ve biçim denetimi (hata verdirmeden uyarır)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests with Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --junitxml=junit/test-results.xml --cov=src --cov-report=term-missing

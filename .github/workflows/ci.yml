name: CI Pipeline - Geospatial Hydrology

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov flake8 torch torchvision numpy xarray scipy rasterio
          pip install pytest pytest-cov flake8 torch torchvision numpy xarray scipy

      - name: Lint with Flake8 (Non-blocking)
        run: |
          # Syntax ve import kontrolleri (bilgi amaçlı çalışır, build'i kırmaz)
          flake8 src/ tests/ --count --exit-zero --max-line-length=127 --statistics

      - name: Run Unit Tests with Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

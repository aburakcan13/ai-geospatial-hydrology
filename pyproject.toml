[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-geospatial-hydrology"
version = "0.1.0"
description = "Machine Learning and Decision Support for Surface Water Dynamics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "numpy",
    "xarray",
    "scipy",
    "pystac-client"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

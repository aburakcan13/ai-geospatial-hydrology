[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-hydrology-ai"
version = "0.1.0"
description = "Official companion codebase for AI-Driven Geospatial Hydrology (Springer Nature)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Burak Can", email = "burakcan@tarsus.edu.tr" }
]
keywords = [
    "deep-learning",
    "hydrology",
    "remote-sensing",
    "earth-observation",
    "segmentation",
    "transformers"
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "rasterio>=1.3.9",
    "geopandas>=0.14.3",
    "xarray>=2024.2.0",
    "rioxarray>=0.15.0",
    "earthengine-api>=0.1.390",
    "albumentations>=1.4.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.2.0",
    "flake8>=7.0.0"
]
